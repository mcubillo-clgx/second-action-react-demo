name: Test Project
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Get code
              uses: actions/checkout@v7
            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 'latest'
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
